# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: junkyard
      POSTGRES_PASSWORD: junkyard
      POSTGRES_DB: junkyardgold
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
